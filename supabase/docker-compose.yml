# Stack mínimo de Supabase self-hosted para o Vértice — Fase 1.
#
# Deliberadamente SEM Studio, Storage, imgproxy, postgres-meta, Edge Functions,
# Logflare/Vector ou Supavisor: nenhuma dessas peças é necessária para o marco
# da Fase 1 (login multi-provedor + workspaces/projects/tasks com RLS). Ver
# /Users/rommelcarneiro/.claude/plans/preciso-realizar-uma-mudan-a-eager-pine.md
# para o racional completo. Adicionar de volta é uma questão de acrescentar o
# serviço correspondente do docker-compose.yml oficial do supabase/supabase
# (github.com/supabase/supabase/blob/master/docker/docker-compose.yml), não de
# reestruturar nada aqui.
#
# Uso:
#   cp .env.example .env   # depois preencha os segredos (ver comentários no .env.example)
#   docker compose up -d
#   docker compose ps      # confirma os 5 serviços saudáveis

name: vertice-supabase

services:
  db:
    container_name: vertice-supabase-db
    image: supabase/postgres:17.6.1.136
    restart: unless-stopped
    volumes:
      # Cada arquivo montado individualmente dentro de init-scripts/migrations
      # — NUNCA o diretório /docker-entrypoint-initdb.d inteiro, que já vem
      # com dezenas de scripts próprios da imagem (schemas auth/storage,
      # roles, extensão vault/pgsodium etc.). Sobrescrever o diretório
      # inteiro esconde tudo isso e quebra o bootstrap (foi exatamente o bug
      # da primeira tentativa desta Fase 1 — ver git blame/histórico).
      - ./volumes/db/init/01_roles.sql:/docker-entrypoint-initdb.d/init-scripts/99-roles.sql:Z
      - ./volumes/db/init/02_jwt.sql:/docker-entrypoint-initdb.d/init-scripts/99-jwt.sql:Z
      - ./volumes/db/init/03_realtime_schema.sql:/docker-entrypoint-initdb.d/migrations/99-realtime.sql:Z
      - ./volumes/db/init/04_schema.sql:/docker-entrypoint-initdb.d/migrations/zz-vertice-01-schema.sql:Z
      - ./volumes/db/init/05_rls.sql:/docker-entrypoint-initdb.d/migrations/zz-vertice-02-rls.sql:Z
      # Bind mount externo (não volume Docker anônimo) — facilita backup
      # direto no host (pg_basebackup/rsync), conforme decisão da Fase 1.
      - ./volumes/db/data:/var/lib/postgresql/data:Z
      - db-config:/etc/postgresql-custom
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
    environment:
      POSTGRES_HOST: /var/run/postgresql
      PGPORT: ${POSTGRES_PORT}
      POSTGRES_PORT: ${POSTGRES_PORT}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      # NÃO defina POSTGRES_USER aqui — a imagem supabase/postgres tem seu
      # próprio default (supabase_admin, não "postgres") e todo o bootstrap
      # de papéis internos (migrate.sh) depende dele. Sobrescrever quebra a
      # cadeia inteira (foi exatamente o segundo bug desta Fase 1 — a role
      # criada pelo initdb deixa de ser a que migrate.sh espera).
      PGDATABASE: ${POSTGRES_DB}
      POSTGRES_DB: ${POSTGRES_DB}
      JWT_SECRET: ${JWT_SECRET}
      JWT_EXP: ${JWT_EXPIRY}
    command:
      [
        "postgres",
        "-c", "config_file=/etc/postgresql/postgresql.conf",
        "-c", "log_min_messages=fatal",
      ]

  auth:
    container_name: vertice-supabase-auth
    image: supabase/gotrue:v2.189.0
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9999/health"]
      timeout: 5s
      interval: 5s
      retries: 3
    environment:
      GOTRUE_API_HOST: 0.0.0.0
      GOTRUE_API_PORT: 9999
      API_EXTERNAL_URL: ${API_EXTERNAL_URL}

      GOTRUE_DB_DRIVER: postgres
      GOTRUE_DB_DATABASE_URL: postgres://supabase_auth_admin:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}

      GOTRUE_SITE_URL: ${SITE_URL}
      GOTRUE_URI_ALLOW_LIST: ${ADDITIONAL_REDIRECT_URLS}
      GOTRUE_DISABLE_SIGNUP: ${DISABLE_SIGNUP}

      GOTRUE_JWT_ADMIN_ROLES: service_role
      GOTRUE_JWT_AUD: authenticated
      GOTRUE_JWT_DEFAULT_GROUP_NAME: authenticated
      GOTRUE_JWT_EXP: ${JWT_EXPIRY}
      GOTRUE_JWT_SECRET: ${JWT_SECRET}
      GOTRUE_JWT_ISSUER: ${API_EXTERNAL_URL}

      # Login é 100% via provedores OAuth na Fase 1 — sem cadastro por
      # e-mail/senha e sem SMTP no stack mínimo.
      GOTRUE_EXTERNAL_EMAIL_ENABLED: ${ENABLE_EMAIL_SIGNUP:-false}
      GOTRUE_MAILER_AUTOCONFIRM: ${ENABLE_EMAIL_AUTOCONFIRM:-true}
      GOTRUE_EXTERNAL_ANONYMOUS_USERS_ENABLED: "false"
      GOTRUE_EXTERNAL_PHONE_ENABLED: "false"

      # --- Google (provedor built-in do GoTrue) ---
      GOTRUE_EXTERNAL_GOOGLE_ENABLED: ${GOOGLE_ENABLED:-false}
      GOTRUE_EXTERNAL_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOTRUE_EXTERNAL_GOOGLE_SECRET: ${GOOGLE_SECRET}
      GOTRUE_EXTERNAL_GOOGLE_REDIRECT_URI: ${API_EXTERNAL_URL}/callback

      # --- GitHub (provedor built-in do GoTrue) ---
      GOTRUE_EXTERNAL_GITHUB_ENABLED: ${GITHUB_ENABLED:-false}
      GOTRUE_EXTERNAL_GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GOTRUE_EXTERNAL_GITHUB_SECRET: ${GITHUB_SECRET}
      GOTRUE_EXTERNAL_GITHUB_REDIRECT_URI: ${API_EXTERNAL_URL}/callback

      # --- Canvas: SEM entrada aqui, de propósito ---
      # Spike concluído (ver plano): "canvas" não existe na lista fixa de
      # provedores embutidos do GoTrue (GOTRUE_EXTERNAL_<NOME>_* só cobre
      # Google/GitHub/Azure/Discord/... — confirmado via engenharia reversa
      # do binário v2.189.0). A API "/admin/oauth/providers" que existe no
      # binário é para o GoTrue atuar como *servidor* OAuth para terceiros
      # (RFC 8414) — direção oposta da que precisamos — e respondeu "OAuth
      # server is disabled" mesmo com a flag ligada. Canvas entra como login
      # via um bridge próprio no Next.js (rota /canvas/oauth2/callback +
      # Admin API do Supabase pra materializar a sessão), não por config
      # aqui — ver "Canvas como provedor de login" no plano.

      # --- Passkeys / WebAuthn (beta desde mai/2026 — opt-in explícito) ---
      # Nome exato da variável a confirmar contra a versão pinada do GoTrue no
      # momento da implementação — API beta, pode mudar sem aviso (ver plano).
      GOTRUE_WEBAUTHN_ENABLED: ${PASSKEYS_ENABLED:-false}
      GOTRUE_WEBAUTHN_RP_ID: ${WEBAUTHN_RP_ID}
      GOTRUE_WEBAUTHN_RP_ORIGINS: ${WEBAUTHN_RP_ORIGINS}

  rest:
    container_name: vertice-supabase-rest
    image: postgrest/postgrest:v14.12
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "postgrest", "--ready"]
      interval: 5s
      timeout: 5s
      retries: 3
    environment:
      PGRST_DB_URI: postgres://authenticator:${POSTGRES_PASSWORD}@${POSTGRES_HOST}:${POSTGRES_PORT}/${POSTGRES_DB}
      PGRST_DB_SCHEMAS: public
      PGRST_DB_ANON_ROLE: anon
      PGRST_DB_USE_LEGACY_GUCS: "false"
      PGRST_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_SECRET: ${JWT_SECRET}
      PGRST_APP_SETTINGS_JWT_EXP: ${JWT_EXPIRY}
      # Necessário para o healthcheck "postgrest --ready" — sem servidor
      # admin configurado, esse subcomando não tem o que consultar.
      PGRST_ADMIN_SERVER_PORT: 3001
      PGRST_ADMIN_SERVER_HOST: localhost
    command: ["postgrest"]

  realtime:
    # Nome de container inconsistente mas correto — o Realtime deriva o tenant
    # id fazendo parse do subdomínio, mesmo padrão do compose oficial.
    container_name: realtime-dev.vertice-supabase-realtime
    image: supabase/realtime:v2.102.3
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sSfL --head -o /dev/null -H \"Authorization: Bearer ${ANON_KEY}\" http://localhost:4000/api/tenants/realtime-dev/health",
        ]
      timeout: 5s
      interval: 30s
      retries: 3
      start_period: 10s
    environment:
      PORT: 4000
      DB_HOST: ${POSTGRES_HOST}
      DB_PORT: ${POSTGRES_PORT}
      DB_USER: supabase_admin
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      DB_NAME: ${POSTGRES_DB}
      DB_AFTER_CONNECT_QUERY: "SET search_path TO _realtime"
      DB_ENC_KEY: ${REALTIME_DB_ENC_KEY:-supabaserealtime}
      API_JWT_SECRET: ${JWT_SECRET}
      SECRET_KEY_BASE: ${SECRET_KEY_BASE}
      METRICS_JWT_SECRET: ${JWT_SECRET}
      ERL_AFLAGS: -proto_dist inet_tcp
      DNS_NODES: "''"
      RLIMIT_NOFILE: "10000"
      APP_NAME: realtime
      SEED_SELF_HOST: "true"
      RUN_JANITOR: "true"
      DISABLE_HEALTHCHECK_LOGGING: "true"

  kong:
    container_name: vertice-supabase-kong
    image: kong/kong:3.9.3
    restart: unless-stopped
    depends_on:
      - auth
      - rest
      - realtime
    ports:
      - ${KONG_HTTP_PORT:-8000}:8000/tcp
    volumes:
      - ./volumes/api/kong.yml:/home/kong/temp.yml:ro,Z
      - ./volumes/api/kong-entrypoint.sh:/home/kong/kong-entrypoint.sh:ro,Z
    healthcheck:
      test: ["CMD", "kong", "health"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      KONG_DATABASE: "off"
      KONG_DECLARATIVE_CONFIG: /usr/local/kong/kong.yml
      KONG_ROUTER_FLAVOR: expressions
      KONG_DNS_ORDER: LAST,A,CNAME
      KONG_DNS_NOT_FOUND_TTL: 1
      KONG_DNS_VALID_TTL: 5
      # request-termination é usado pelas rotas de bloqueio do Realtime
      # (openapi/tenants) no kong.yml — sem listar aqui, o parse do
      # declarative config falha e o Kong não sobe.
      KONG_PLUGINS: request-transformer,cors,key-auth,acl,request-termination
      KONG_NGINX_PROXY_PROXY_BUFFER_SIZE: 160k
      KONG_NGINX_PROXY_PROXY_BUFFERS: 64 160k
      KONG_PROXY_ACCESS_LOG: /dev/stdout combined
      # Só chaves legadas (HS256) nesta fase — sem par de chaves opacas/assimétricas.
      SUPABASE_ANON_KEY: ${ANON_KEY}
      SUPABASE_SERVICE_KEY: ${SERVICE_ROLE_KEY}
      SUPABASE_PUBLISHABLE_KEY: ""
      SUPABASE_SECRET_KEY: ""
      ANON_KEY_ASYMMETRIC: ""
      SERVICE_ROLE_KEY_ASYMMETRIC: ""
    entrypoint: ["/bin/sh", "/home/kong/kong-entrypoint.sh"]

volumes:
  db-config:
